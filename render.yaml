services:
  - type: web
    name: lotwise
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: lotwise-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: LOTWISE_ENV
        value: production
      - key: LOTWISE_DATA_DIR
        value: /var/data
      - key: LOTWISE_SECRET_KEY
        generateValue: true
