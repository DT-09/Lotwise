databases:
  - name: lotwise-db
    plan: basic-256mb
    databaseName: lotwise
    user: lotwise

services:
  - type: web
    name: lotwise
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: lotwise-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: LOTWISE_ENV
        value: production
      - key: LOTWISE_DATA_DIR
        value: /var/data
      - key: LOTWISE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lotwise-db
          property: connectionString
      - key: LOTWISE_S3_BUCKET
        sync: false
      - key: LOTWISE_S3_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
